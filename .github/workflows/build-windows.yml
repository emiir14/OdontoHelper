name: Build OdontoHelper Windows (.exe)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publicar OdontoHelper-Setup.exe en GitHub Releases (habilita descarga y actualizaciones)'
        type: boolean
        default: true
      release_tag:
        description: 'Versión del Release (ej. v1.0.1)'
        type: string
        default: 'v1.0.1'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      CARGO_TARGET_DIR: D:\t

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate cloud environment variables
        shell: pwsh
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || vars.VITE_FIREBASE_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:VITE_SUPABASE_URL) -or [string]::IsNullOrWhiteSpace($env:VITE_SUPABASE_ANON_KEY)) {
            throw "Faltan VITE_SUPABASE_URL y/o VITE_SUPABASE_ANON_KEY en GitHub -> Settings -> Secrets and variables -> Actions. Sin estas variables el .exe no sincroniza sesiones ni transcripciones con Supabase."
          }
          if (-not ($env:VITE_SUPABASE_URL -match '^https?://')) {
            throw "VITE_SUPABASE_URL debe comenzar con https:// (valor actual inválido)."
          }
          if ([string]::IsNullOrWhiteSpace($env:VITE_FIREBASE_API_KEY)) {
            Write-Warning "VITE_FIREBASE_API_KEY no está configurada. El .exe se compilará con sincronización en Supabase, pero sin OAuth de Google Calendar."
          }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust stable (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup LLVM / Clang (required for whisper-rs bindgen)
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: '18.1'

      - name: Setup Vulkan SDK (GPU acceleration + glslc shader compiler)
        uses: jakoch/install-vulkan-sdk-action@v1.8.1
        with:
          cache: true

      - name: Rust & Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-targets: false
          prefix-key: windows-vulkan

      - name: Install web dependencies
        shell: pwsh
        run: |
          Remove-Item -Force package-lock.json -ErrorAction SilentlyContinue
          npm install --include=optional --no-audit --no-fund

      - name: Generate exact Windows & NSIS icons
        run: npx --yes @tauri-apps/cli@2 icon public/pwa-512x512.png

      - name: Build Tauri NSIS installer (.exe)
        shell: pwsh
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
          VITE_GITHUB_REPO: ${{ vars.VITE_GITHUB_REPO || secrets.VITE_GITHUB_REPO || github.repository }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN || vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID || vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET || vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID || vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID || vars.VITE_FIREBASE_APP_ID }}
        run: |
          New-Item -ItemType Directory -Force -Path "D:\t" | Out-Null
          npx --yes @tauri-apps/cli@2 build --bundles nsis

      - name: Stage unsigned OdontoHelper-Setup.exe
        shell: pwsh
        run: |
          $nsisDir = "D:\t\release\bundle\nsis"
          $outDir = "release-artifacts"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $exe = Get-ChildItem -Path $nsisDir -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $exe) { throw "No NSIS setup .exe found in $nsisDir" }
          Copy-Item $exe.FullName "$outDir\OdontoHelper-Setup.exe" -Force
          Get-FileHash "$outDir\OdontoHelper-Setup.exe" -Algorithm SHA256 | Out-File "$outDir\OdontoHelper-Setup.exe.sha256"

      - name: Upload unsigned installer artifact for SignPath
        id: upload_unsigned
        uses: actions/upload-artifact@v4
        with:
          name: odontohelper-windows-unsigned
          path: release-artifacts/OdontoHelper-Setup.exe

      - name: Check SignPath Foundation configuration
        id: signpath_check
        shell: pwsh
        env:
          SIGNPATH_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORG: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
        run: |
          if ($env:SIGNPATH_TOKEN -and $env:SIGNPATH_ORG) {
            "enabled=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            Write-Host "SignPath Foundation aún no configurado (faltan SIGNPATH_API_TOKEN o SIGNPATH_ORGANIZATION_ID). Se publicará el instalador sin firma Authenticode hasta configurarlo."
            "enabled=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Submit signing request to SignPath Foundation
        if: steps.signpath_check.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'odontohelper' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.upload_unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-artifacts

      - name: Promote signed installer if SignPath ran
        if: steps.signpath_check.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $signedExe = Get-ChildItem -Path "signed-artifacts" -Filter "*.exe" -Recurse | Select-Object -First 1
          if (-not $signedExe) { throw "SignPath finished without an .exe in signed-artifacts" }
          Copy-Item $signedExe.FullName "release-artifacts\OdontoHelper-Setup.exe" -Force
          Get-FileHash "release-artifacts\OdontoHelper-Setup.exe" -Algorithm SHA256 | Out-File "release-artifacts\OdontoHelper-Setup.exe.sha256"

      - name: Upload final Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: odontohelper-windows-exe
          path: |
            release-artifacts/OdontoHelper-Setup.exe
            release-artifacts/OdontoHelper-Setup.exe.sha256

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: OdontoHelper ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
          files: |
            release-artifacts/OdontoHelper-Setup.exe
            release-artifacts/OdontoHelper-Setup.exe.sha256
          generate_release_notes: true
