name: Build OdontoHelper Android (.apk)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publicar OdontoHelper.apk en GitHub Releases'
        type: boolean
        default: true
      release_tag:
        description: 'Versión del Release (ej. v1.0.1)'
        type: string
        default: 'v1.0.1'

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate cloud environment variables
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || vars.VITE_FIREBASE_API_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::Faltan VITE_SUPABASE_URL y/o VITE_SUPABASE_ANON_KEY en GitHub -> Settings -> Secrets and variables -> Actions. Sin estas variables el .apk no sincroniza sesiones ni transcripciones con Supabase."
            exit 1
          fi
          case "$VITE_SUPABASE_URL" in
            https://*|http://*) ;;
            *)
              echo "::error::VITE_SUPABASE_URL debe comenzar con https://"
              exit 1
              ;;
          esac
          if [ -z "$VITE_FIREBASE_API_KEY" ]; then
            echo "::warning::VITE_FIREBASE_API_KEY no está configurada. El .apk sincronizará con Supabase, pero sin OAuth de Google Calendar."
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Rust stable with Android ARM64 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Android SDK, NDK and Build Tools
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME="$SDK_DIR"
          export ANDROID_SDK_ROOT="$SDK_DIR"
          export PATH="$SDK_DIR/cmdline-tools/latest/bin:$SDK_DIR/platform-tools:$PATH"
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"
          {
            echo "ANDROID_HOME=$SDK_DIR"
            echo "ANDROID_SDK_ROOT=$SDK_DIR"
            echo "NDK_HOME=$SDK_DIR/ndk/27.0.12077973"
            echo "ANDROID_NDK_HOME=$SDK_DIR/ndk/27.0.12077973"
          } >> "$GITHUB_ENV"
          echo "$SDK_DIR/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_DIR/platform-tools" >> "$GITHUB_PATH"

      - name: Rust & Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-targets: false
          prefix-key: android-arm64

      - name: Install web dependencies
        run: |
          rm -f package-lock.json
          npm install --no-audit --no-fund

      - name: Initialize Tauri Android project
        run: npx --yes @tauri-apps/cli@2 android init --ci

      - name: Generate Android launcher icons
        run: npx --yes @tauri-apps/cli@2 icon public/pwa-512x512.png

      - name: Configure Android microphone & privacy manifest permissions
        run: node scripts/patch-android-project.mjs

      - name: Build Android APK (ARM64)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
          VITE_GITHUB_REPO: ${{ vars.VITE_GITHUB_REPO || secrets.VITE_GITHUB_REPO || github.repository }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN || vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID || vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET || vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID || vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID || vars.VITE_FIREBASE_APP_ID }}
        run: npx --yes @tauri-apps/cli@2 android build --apk --target aarch64

      - name: Align and sign OdontoHelper.apk
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p release-artifacts
          RAW_APK=$(find src-tauri/gen/android/app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          if [ -z "$RAW_APK" ]; then
            echo "No APK produced under src-tauri/gen/android/app/build/outputs/apk"
            exit 1
          fi
          echo "Found built APK: $RAW_APK"

          BUILD_TOOLS_DIR="$ANDROID_HOME/build-tools/35.0.0"
          ALIGNED_APK="release-artifacts/OdontoHelper-aligned.apk"
          FINAL_APK="release-artifacts/OdontoHelper.apk"

          "$BUILD_TOOLS_DIR/zipalign" -f -p 4 "$RAW_APK" "$ALIGNED_APK"

          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > /tmp/odontohelper-release.jks
            ALIAS="${KEY_ALIAS:-odontohelper}"
            KS_PASS="${KEYSTORE_PASS}"
            K_PASS="${KEY_PASS:-$KEYSTORE_PASS}"
          else
            echo "ANDROID_KEYSTORE_BASE64 no configurado; generando firma de distribución temporal para que el APK sea instalable."
            keytool -genkeypair -v \
              -keystore /tmp/odontohelper-release.jks \
              -alias odontohelper \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass odontohelper-local-key -keypass odontohelper-local-key \
              -dname "CN=OdontoHelper, OU=Salud, O=OdontoHelper, L=Montevideo, C=UY"
            ALIAS="odontohelper"
            KS_PASS="odontohelper-local-key"
            K_PASS="odontohelper-local-key"
          fi

          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks /tmp/odontohelper-release.jks \
            --ks-key-alias "$ALIAS" \
            --ks-pass "pass:$KS_PASS" \
            --key-pass "pass:$K_PASS" \
            --out "$FINAL_APK" \
            "$ALIGNED_APK"

          rm -f "$ALIGNED_APK" /tmp/odontohelper-release.jks
          sha256sum "$FINAL_APK" > release-artifacts/OdontoHelper.apk.sha256

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: odontohelper-android-apk
          path: |
            release-artifacts/OdontoHelper.apk
            release-artifacts/OdontoHelper.apk.sha256

      - name: Publish OdontoHelper.apk to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: OdontoHelper ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
          files: |
            release-artifacts/OdontoHelper.apk
            release-artifacts/OdontoHelper.apk.sha256
          generate_release_notes: true
